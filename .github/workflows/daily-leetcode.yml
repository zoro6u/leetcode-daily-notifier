name: Daily LeetCode Notifier

on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 Kigali — send today's question
    - cron: "0 19 * * *"  # 21:00 Kigali — remind if not solved
  workflow_dispatch:
    inputs:
      mode:
        description: "Which message to send"
        type: choice
        options: [morning, evening]
        default: morning

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LC_USERNAME: ${{ secrets.LC_USERNAME }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 19 * * *' && 'evening' || 'morning') }}
        run: python notify.py "$MODE"
